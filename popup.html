<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto RTL/LTR Switcher</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Tahoma, Arial, sans-serif;
      margin: 0;
      padding: 10px;
      width: 230px;
      background: #ebebeb;
    }

    h3 {
      margin: 0 0 8px 2px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }

    button.row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 12px;
      background: #fff;
      border: none;
      border-radius: 5px;
      margin-bottom: 5px;
      cursor: pointer;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 13px;
      color: #333;
      text-align: left;
    }

    button.row:hover { background: #f5f5f5; }
    button.row.active { background: #e8f5e9; }

    button.row .hint {
      color: #999;
      font-size: 12px;
    }

    /* Disable toggle row — same visual weight as buttons above */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #fff;
      border-radius: 5px;
      margin-bottom: 5px;
      font-size: 13px;
      color: #333;
    }

    /* Switch */
    .switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .switch input { display: none; }

    .slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    /* GREEN when active */
    input:checked + .slider { background: #4caf50; }
    input:checked + .slider::before { transform: translateX(16px); }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h3>Page Text Settings</h3>

  <button class="row" id="toggleFont">
    <span>Toggle Font</span>
    <span class="hint">(Vazirmatn)</span>
  </button>

  <button class="row" id="toggleDirection">
    <span>Toggle Direction</span>
    <span class="hint">(Alt+Shift+D)</span>
  </button>

  <div class="toggle-row">
    <span>Disable on this site</span>
    <label class="switch">
      <input type="checkbox" id="toggleSiteDisabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer" id="versionLabel">Auto RTL/LTR Switcher</div>

  <script src="popup.js"></script>
</body>
</html>
